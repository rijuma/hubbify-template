name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub environment to deploy. Its envs/ folder is the one whose server.conf has ENV=<name>, else the one with the same name"
        type: environment
        required: true

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Maps the GitHub environment to its envs/ folder: a server.conf declaring
  # ENV=<github environment> wins, otherwise the folder of the same name.
  # Runs before the environment is resolved, so a typo creates nothing.
  check:
    runs-on: ubuntu-latest
    outputs:
      folder: ${{ steps.resolve.outputs.folder }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the envs/ folder
        id: resolve
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          name="$ENVIRONMENT"
          matches=$(grep -lx "ENV=$name" envs/*/server.conf 2>/dev/null || true)
          count=$(printf '%s' "$matches" | grep -c . || true)
          if [ "$count" -gt 1 ]; then
            echo "::error::ENV=$name is declared in more than one server.conf: $(echo $matches)"
            exit 1
          fi
          if [ "$count" -eq 1 ]; then
            folder=$(basename "$(dirname "$matches")")
          else
            folder="$name"
          fi
          if [ ! -f "envs/$folder/server.conf" ]; then
            remote=$(ls envs/*/server.conf 2>/dev/null | xargs -n1 dirname | xargs -n1 basename | tr '\n' ' ')
            echo "::error::No envs/ folder for GitHub environment '$name' (looked for ENV=$name in a server.conf, then envs/$name). Remote envs: ${remote:-none}"
            exit 1
          fi
          echo "Deploying envs/$folder for GitHub environment '$name'"
          echo "folder=$folder" >> "$GITHUB_OUTPUT"

  deploy:
    needs: check
    # Skip in the original template repo (no environments configured there)
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    # Protection rules of the GitHub environment (required reviewers,
    # deployment branches) are the confirmation gate here — `just deploy`
    # skips its interactive prompt when CI is set.
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before any secret is on disk, so no third-party action runs with them.
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check the GitHub environment is configured
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          # Environment variable set per GitHub environment: deploy@your-server-ip
          SERVER_SSH: ${{ vars.SERVER_SSH }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$SERVER_SSH" ]; then
            echo "::error::GitHub environment '$ENVIRONMENT' has no SERVER_SSH variable. Create the environment under Settings → Environments with SERVER_SSH, SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS and ENV_FILE (README, Deploying)."
            exit 1
          fi
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::GitHub environment '$ENVIRONMENT' has no SSH_PRIVATE_KEY secret. Set it to the private key authorized for the SERVER_SSH user (README, Deploying)."
            exit 1
          fi
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::GitHub environment '$ENVIRONMENT' has no SSH_KNOWN_HOSTS secret. Set it to the output of \`ssh-keyscan <server>\`, checked against the server's real host key (README, Deploying)."
            exit 1
          fi
          if [ -z "$ENV_FILE" ]; then
            echo "::error::GitHub environment '$ENVIRONMENT' has no ENV_FILE secret. Set it to the app's env for this target, verbatim (KEY=value lines); an env with no values still needs it, set to a comment line such as '# no values' (README, Deploying)."
            exit 1
          fi

      - name: SSH setup
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key only: the previous step fails when the secret is unset.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Create the docker context the env expects
        env:
          FOLDER: ${{ needs.check.outputs.folder }}
          SERVER_SSH: ${{ vars.SERVER_SSH }}
        run: |
          source "envs/$FOLDER/server.conf"
          docker context create "$DOCKER_CONTEXT" --docker "host=ssh://$SERVER_SSH"

      - name: Write env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FOLDER: ${{ needs.check.outputs.folder }}
        run: |
          umask 077
          printf '%s' "$ENV_FILE" > "envs/$FOLDER/.env"

      - name: Deploy
        env:
          FOLDER: ${{ needs.check.outputs.folder }}
        run: just deploy "$FOLDER"

      - name: Status
        env:
          FOLDER: ${{ needs.check.outputs.folder }}
        run: just ps "$FOLDER"
