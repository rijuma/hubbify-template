# Prod delta: real domain (overrides only the `caddy` label; compose merges
# labels by key), production image, and hardening.
services:
  web:
    build:
      target: prod
    env_file:
      # Production secrets. The Deploy workflow writes this file on the runner
      # from the GitHub environment's ENV_FILE secret; it never lives locally.
      # Resolved from the project root (--project-directory), not this folder.
      - path: envs/prod/.env
        required: false
    restart: unless-stopped
    mem_limit: 512m
    environment:
      - NODE_ENV=production
    labels:
      caddy: myapp.example.com
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 10s
      timeout: 3s
      retries: 3

  # A database for this env is declared here too (see envs/local/compose.yml
  # for the full block, plus restart/mem_limit hardening) — or skip it and
  # point DATABASE_URL in envs/prod/.env at a managed instance instead.
