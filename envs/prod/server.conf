# Deploy target for this environment. The presence of this file marks the
# env as remote: `just deploy <env>` requires it, local recipes refuse it.

# Docker SSH context that reaches the server, created once per machine with:
#   docker context create <name> --docker "host=ssh://user@server"
DOCKER_CONTEXT=myvps

# Must match SERVER_NAME in the hubbify server's servers/<name>/server.env
# (stamped as a label on the proxy). The deploy aborts if the context points
# at a server with a different stamp.
SERVER_NAME=myvps

# Ask for typed confirmation before manual deploys. CI skips the prompt —
# GitHub environment protection rules are the gate there.
PROTECTED=true

# Optional: override the compose project name (default: <project>-<env>).
# COMPOSE_PROJECT=myapp

# Optional: the GitHub environment that deploys this folder, when its name
# differs from the folder's (default: the folder name).
# ENV=production
