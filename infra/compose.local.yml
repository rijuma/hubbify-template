# Local development delta: dev image with hot reload via mounted sources.
# Local-only env/secrets live in infra/.env (gitignored, optional).
services:
  web:
    build:
      target: dev
    env_file:
      # Resolved from the project root (--project-directory), not this folder.
      - path: infra/.env
        required: false
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
    develop:
      watch:
        - action: rebuild
          path: ./web/package.json

  # Uncomment to reach the database from the host (localhost:5432):
  # postgres:
  #   ports:
  #     - "5432:5432"
