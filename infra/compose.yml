x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    networks:
      - default
      - proxy
    labels:
      caddy: myapp.localhost
      caddy.reverse_proxy: '{{upstreams 3000}}'
    <<: *logging

  # Uncomment to add a database (stays on the default network only —
  # invisible to the proxy and to other projects):
  # postgres:
  #   image: postgres:17-alpine
