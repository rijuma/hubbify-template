# Base compose: only what is true in every environment. Anything that
# differs per env (databases, domains, hardening) lives in envs/<env>/compose.yml.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    networks:
      - default
      - proxy
    labels:
      caddy: myapp.localhost
      caddy.reverse_proxy: '{{upstreams 3000}}'
    <<: *logging

networks:
  proxy:
    external: true
